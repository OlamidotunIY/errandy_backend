# errandy — Local Development Stack
# Usage: docker compose -f infrastructure/docker/docker-compose.yml up -d
# Services: Redis, Errandy API, Errandy Worker

name: errandy

services:
  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: errandy-redis
    restart: unless-stopped
    networks:
      - errandy-net
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

