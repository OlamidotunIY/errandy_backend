apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: errandy-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: api.errandy.com.ng
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: errandy-api
            port:
              number: 8080
