# ==============================================================================
# Deployment
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: errandy-backend
  namespace: errandy
  labels:
    app.kubernetes.io/name: errandy-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: errandy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: errandy-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: errandy-backend
        app.kubernetes.io/component: backend
    spec:
      # Use DOCR registry credentials
      imagePullSecrets:
        - name: docr-registry

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      containers:
        - name: errandy-backend
          image: registry.digitalocean.com/errandy/errandy-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3500
              protocol: TCP

          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: errandy-backend-config
            - secretRef:
                name: errandy-backend-secrets

          # Resource limits
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'

          # Liveness probe - restart container if unhealthy
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          # Readiness probe - remove from service if not ready
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6

          # Startup probe - allow slow starts
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30

      # Graceful shutdown
      terminationGracePeriodSeconds: 30
