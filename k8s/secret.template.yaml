# ==============================================================================
# Secret - Sensitive credentials (TEMPLATE)
# ==============================================================================
# WARNING: This is a template file!
# 1. Copy this file to secret.yaml (add to .gitignore)
# 2. Replace placeholder values with base64-encoded real values
# 3. To encode: echo -n "your-value" | base64
#
# DO NOT commit real secrets to version control!
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: errandy-backend-secrets
  namespace: errandy
  labels:
    app.kubernetes.io/name: errandy-backend
    app.kubernetes.io/component: backend
type: Opaque
data:
  # Database
  # echo -n "mongodb+srv://user:pass@host/db" | base64
  DATABASE_URL: 'REPLACE_WITH_BASE64_ENCODED_VALUE'

  # Google OAuth
  # echo -n "your-client-id" | base64
  GOOGLE_CLIENT_ID: 'REPLACE_WITH_BASE64_ENCODED_VALUE'
  GOOGLE_CLIENT_SECRET: 'REPLACE_WITH_BASE64_ENCODED_VALUE'
  GOOGLE_PLACES_API_KEY: 'REPLACE_WITH_BASE64_ENCODED_VALUE'

  # Twilio
  TWILIO_ACCOUNT_SID: 'REPLACE_WITH_BASE64_ENCODED_VALUE'
  TWILIO_AUTH_TOKEN: 'REPLACE_WITH_BASE64_ENCODED_VALUE'
  TWILIO_WHATSAPP_NUMBER: 'REPLACE_WITH_BASE64_ENCODED_VALUE'
  TWILIO_SMS_NUMBER: 'REPLACE_WITH_BASE64_ENCODED_VALUE'
  TWILIO_OTP_CONTENT_SID: 'REPLACE_WITH_BASE64_ENCODED_VALUE'

  # Paystack
  PAYSTACK_SECRET_KEY: 'REPLACE_WITH_BASE64_ENCODED_VALUE'
  PAYSTACK_PUBLIC_KEY: 'REPLACE_WITH_BASE64_ENCODED_VALUE'

  # Firebase (path to service account JSON - will be mounted as volume)
  FIREBASE_SERVICE_ACCOUNT_KEY: 'REPLACE_WITH_BASE64_ENCODED_VALUE'
  # Firebase Storage bucket name
  FIREBASE_STORAGE_BUCKET: 'REPLACE_WITH_BASE64_ENCODED_VALUE'

  # Resend Email API
  # echo -n "re_xxxx" | base64
  RESEND_API: 'REPLACE_WITH_BASE64_ENCODED_VALUE'
