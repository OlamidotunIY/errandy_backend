apiVersion: v1
kind: Service
metadata:
  name: errandy-backend
  namespace: errandy
  labels:
    app.kubernetes.io/name: errandy-backend
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3500
      protocol: TCP
  selector:
    app.kubernetes.io/name: errandy-backend
