name: Deploy to Droplet

on:
  workflow_run:
    workflows: ["Build & Push (DOCR)"]
    types: [completed]
    branches: ["main"]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      REGISTRY_IMAGE: registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/errandy-backend
      APP_DIR: /opt/errandy_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH key (runner)
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/do_droplet_key <<'KEY'
          ${{ secrets.DROPLET_SSH_KEY }}
          KEY
          chmod 600 ~/.ssh/do_droplet_key
          sed -i 's/\r$//' ~/.ssh/do_droplet_key
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Validate SSH key parses (runner)
        run: |
          ssh-keygen -yf ~/.ssh/do_droplet_key >/dev/null
          echo "SSH key parsed OK"

      - name: Ensure app directory exists (droplet)
        run: |
          ssh -i ~/.ssh/do_droplet_key "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "sudo mkdir -p '${{ env.APP_DIR }}' && sudo chown -R $USER:$USER '${{ env.APP_DIR }}'"

      - name: Upload docker-compose.prod.yml (droplet)
        run: |
          scp -i ~/.ssh/do_droplet_key docker-compose.prod.yml \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:${{ env.APP_DIR }}/docker-compose.prod.yml"

      - name: Deploy on droplet
        env:
          DO_ACCESS_TOKEN: ${{ secrets.DO_ACCESS_TOKEN }}
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
          APP_DIR: ${{ env.APP_DIR }}
        run: |
          ssh -i ~/.ssh/do_droplet_key "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "DO_ACCESS_TOKEN='${DO_ACCESS_TOKEN}' REGISTRY_IMAGE='${REGISTRY_IMAGE}' APP_DIR='${APP_DIR}' bash -s" <<'EOF'
          set -euo pipefail

          cd "$APP_DIR"

          # Avoid HOME permission issues; use a writable docker config directory
          export DOCKER_CONFIG=/tmp/docker-config
          mkdir -p "$DOCKER_CONFIG"

          # DOCR login (no doctl on droplet)
          # Use token as both username/password for CI-style auth
          echo "$DO_ACCESS_TOKEN" | docker login registry.digitalocean.com -u "$DO_ACCESS_TOKEN" --password-stdin

          # Ensure compose variable is available
          export REGISTRY_IMAGE="$REGISTRY_IMAGE"

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          docker image prune -af || true

          # Health check locally on droplet (avoid Cloudflare/DNS/TLS variables)
          HEALTH_URL="http://127.0.0.1/health"
          echo "Checking health: $HEALTH_URL"

          ok=0
          for i in $(seq 1 45); do
            if curl -fsS "$HEALTH_URL" >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "Health check failed: $HEALTH_URL"
            docker compose -f docker-compose.prod.yml ps || true
            docker compose -f docker-compose.prod.yml logs --tail 300 api worker redis || true
            exit 1
          fi

          echo "Deploy successful. Health check OK."
          EOF
