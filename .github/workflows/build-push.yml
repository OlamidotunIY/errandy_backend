name: Build and Push to DOCR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/errandy
  IMAGE_NAME: errandy-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }} .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Delete old images (keep only latest)
        run: |
          # Get all tags except current and latest
          CURRENT_TAG="${{ steps.sha.outputs.short }}"

          # List all tags and delete old ones
          doctl registry repository list-tags ${{ env.IMAGE_NAME }} --format Tag --no-header | while read TAG; do
            if [ "$TAG" != "$CURRENT_TAG" ] && [ "$TAG" != "latest" ]; then
              echo "Deleting old tag: $TAG"
              doctl registry repository delete-tag ${{ env.IMAGE_NAME }} $TAG --force || true
            fi
          done

      - name: Run garbage collection
        run: |
          doctl registry garbage-collection start --include-untagged-manifests --force || true

      - name: Output image info
        run: |
          echo "✅ Image pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}"
          echo "✅ Also tagged as: latest"
          echo ""
          echo "Deploy with:"
          echo "  kubectl rollout restart deployment/errandy-backend -n errandy"
