name: Deploy NestJS to DigitalOcean Droplet

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE: registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/errandy-backend:do-latest
      REGISTRY_IMAGE: registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/errandy-backend
      APP_DIR: /opt/errandy_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate doctl in CI (works; no droplet config involved)
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Login to DO Container Registry (DOCR)
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_ACCESS_TOKEN }}
          password: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Build and push image (single stable tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: keep storage under control on DOCR free tier
      - name: Registry garbage collection (optional)
        run: doctl registry garbage-collection start --include-untagged-manifests --force

      - name: Prepare SSH key (runner)
        run: |
          mkdir -p ~/.ssh
          # Write the key exactly as stored (preserves newlines)
          cat > ~/.ssh/do_droplet_key <<'KEY'
          ${{ secrets.DROPLET_SSH_KEY }}
          KEY
          chmod 600 ~/.ssh/do_droplet_key
          # Remove any Windows CRLF that can break key parsing
          sed -i 's/\r$//' ~/.ssh/do_droplet_key
          # Pin host key to avoid interactive prompt
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Validate SSH key parses (runner)
        run: |
          ssh-keygen -yf ~/.ssh/do_droplet_key >/dev/null
          echo "SSH key parsed OK"

      - name: Ensure app directory exists (droplet)
        run: |
          ssh -i ~/.ssh/do_droplet_key "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "mkdir -p '${{ env.APP_DIR }}'"

      - name: Upload docker-compose.prod.yml (droplet)
        run: |
          scp -i ~/.ssh/do_droplet_key docker-compose.prod.yml \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:${{ env.APP_DIR }}/docker-compose.prod.yml"

      - name: Upload nginx config (droplet)
        run: |
          scp -i ~/.ssh/do_droplet_key -r nginx \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:${{ env.APP_DIR }}/"

      - name: Deploy on droplet
        env:
          DO_ACCESS_TOKEN: ${{ secrets.DO_ACCESS_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          ssh -i ~/.ssh/do_droplet_key "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "DO_ACCESS_TOKEN='${DO_ACCESS_TOKEN}' HEALTHCHECK_URL='${HEALTHCHECK_URL}' REGISTRY_IMAGE='${REGISTRY_IMAGE}' APP_DIR='${{ env.APP_DIR }}' bash -s" <<'EOF'
          set -euo pipefail

          cd "$APP_DIR"

          # DOCR login WITHOUT doctl.
          # Use a writable docker config dir to avoid HOME permission problems.
          export DOCKER_CONFIG=/tmp/docker-config
          mkdir -p "$DOCKER_CONFIG"
          echo "$DO_ACCESS_TOKEN" | docker login registry.digitalocean.com -u token --password-stdin

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          # Safe if droplet is dedicated to this app
          docker image prune -af || true

          HEALTH_URL="${HEALTHCHECK_URL:-http://localhost/health}"
          echo "Checking health: $HEALTH_URL"

          ok=0
          for i in $(seq 1 45); do
            if curl -fsS "$HEALTH_URL" > /dev/null; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "Health check failed: $HEALTH_URL"
            docker compose -f docker-compose.prod.yml ps || true
            docker compose -f docker-compose.prod.yml logs --tail 300 api worker redis || true
            exit 1
          fi


          echo "Deploy successful. Health check OK: $HEALTH_URL"
          EOF
