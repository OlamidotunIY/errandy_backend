name: Deploy NestJS to DigitalOcean Droplet (DOCR + Docker Compose)

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      REGISTRY_IMAGE: registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/errandy-backend
      IMAGE_TAG: do-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Login Docker to DO Container Registry (CI)
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push image (single stable tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: you can keep this; consider moving to a scheduled workflow later
      - name: Registry garbage collection (optional)
        run: doctl registry garbage-collection start --include-untagged-manifests --force

  deploy:
    runs-on: ubuntu-latest
    needs: build

    env:
      REGISTRY_IMAGE: registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/errandy-backend
      APP_DIR: /opt/errandy_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH key (runner)
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/do_droplet_key <<'KEY'
          ${{ secrets.DROPLET_SSH_KEY }}
          KEY
          chmod 600 ~/.ssh/do_droplet_key
          sed -i 's/\r$//' ~/.ssh/do_droplet_key
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Validate SSH key parses (runner)
        run: |
          ssh-keygen -yf ~/.ssh/do_droplet_key >/dev/null
          echo "SSH key parsed OK"

      - name: Ensure app directory exists (droplet)
        run: |
          ssh -i ~/.ssh/do_droplet_key "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "mkdir -p '${{ env.APP_DIR }}'"

      - name: Upload docker-compose.prod.yml (droplet)
        run: |
          scp -i ~/.ssh/do_droplet_key docker-compose.prod.yml \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:${{ env.APP_DIR }}/docker-compose.prod.yml"

      - name: Deploy on droplet
        env:
          DO_ACCESS_TOKEN: ${{ secrets.DO_ACCESS_TOKEN }}
        run: |
          ssh -i ~/.ssh/do_droplet_key "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "DO_ACCESS_TOKEN='${DO_ACCESS_TOKEN}' APP_DIR='${{ env.APP_DIR }}' REGISTRY_IMAGE='${{ env.REGISTRY_IMAGE }}' bash -s" <<'EOF'
          set -euo pipefail

          cd "$APP_DIR"

          # DOCR login WITHOUT doctl; use a writable config dir to avoid HOME permission issues
          export DOCKER_CONFIG=/tmp/docker-config
          mkdir -p "$DOCKER_CONFIG"
          echo "$DO_ACCESS_TOKEN" | docker login registry.digitalocean.com -u token --password-stdin

          export REGISTRY_IMAGE="$REGISTRY_IMAGE"
          export IMAGE_TAG="do-latest"

          # Best-effort: tag the currently running image as a local rollback target
          api_container_id="$(docker compose -f docker-compose.prod.yml ps -q api || true)"
          if [ -n "${api_container_id:-}" ]; then
            current_image_id="$(docker inspect -f '{{.Image}}' "$api_container_id" || true)"
            if [ -n "${current_image_id:-}" ]; then
              echo "Saving rollback image from current api container..."
              docker tag "$current_image_id" "$REGISTRY_IMAGE:rollback" || true
              docker rm -f errandy_backend_rollback_holder >/dev/null 2>&1 || true
              docker create --name errandy_backend_rollback_holder "$REGISTRY_IMAGE:rollback" sh -c "sleep infinity" >/dev/null 2>&1 || true
            fi
          fi

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          # Safe only if droplet is dedicated to this app
          docker image prune -af || true

          echo "Checking API health inside container..."

          ok=0
          for i in $(seq 1 45); do
            # Do not depend on curl inside container; use Node (already present)
            if docker compose -f docker-compose.prod.yml exec -T api node -e "
              const http=require('http');
              const port=process.env.PORT||8080;
              const req=http.get('http://127.0.0.1:'+port+'/health', res => process.exit(res.statusCode===200?0:1));
              req.on('error', () => process.exit(1));
            "; then
              ok=1
              break
            fi
            echo \"Health not ready yet ($i/45). Waiting 2s...\"
            sleep 2
          done

          if [ \"$ok\" -ne 1 ]; then
            echo \"Health check FAILED inside container\"
            echo \"=== docker compose ps ===\"
            docker compose -f docker-compose.prod.yml ps || true
            echo \"=== api logs ===\"
            docker compose -f docker-compose.prod.yml logs --tail 300 api || true
            echo \"=== worker logs ===\"
            docker compose -f docker-compose.prod.yml logs --tail 300 worker || true
            echo \"=== redis logs ===\"
            docker compose -f docker-compose.prod.yml logs --tail 200 redis || true
            exit 1
          fi

          echo "Deploy successful. Health check OK."
          EOF
