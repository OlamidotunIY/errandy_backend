name: Deploy NestJS to DigitalOcean Droplet (DOCR + Docker Compose)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE: registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/errandy-backend:do-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Login Docker to DO Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push image (single stable tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: Keep, but consider moving to a daily scheduled workflow later
      - name: Registry garbage collection
        run: doctl registry garbage-collection start --include-untagged-manifests --force

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/do_droplet_key
          chmod 600 ~/.ssh/do_droplet_key
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure app directory exists
        run: |
          ssh -i ~/.ssh/do_droplet_key "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "mkdir -p /opt/errandy_backend"

      - name: Upload docker-compose.prod.yml
        run: |
          scp -i ~/.ssh/do_droplet_key docker-compose.prod.yml \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/opt/errandy_backend/docker-compose.prod.yml"

      - name: Deploy on droplet
        env:
          DO_ACCESS_TOKEN: ${{ secrets.DO_ACCESS_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          DO_REGISTRY_NAME: ${{ secrets.DO_REGISTRY_NAME }}
        run: |
          ssh -i ~/.ssh/do_droplet_key "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "DO_ACCESS_TOKEN='${DO_ACCESS_TOKEN}' DO_REGISTRY_NAME='${DO_REGISTRY_NAME}' HEALTHCHECK_URL='${HEALTHCHECK_URL}' bash -s" <<'EOF'
          set -euo pipefail

          APP_DIR="/opt/errandy_backend"
          cd "$APP_DIR"

          # Login to DOCR without relying on doctl config
          doctl --access-token "$DO_ACCESS_TOKEN" registry login --expiry-seconds 1200

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          docker image prune -af || true

          HEALTH_URL="${HEALTHCHECK_URL:-http://localhost:3000/health}"
          if ! curl -fsS "$HEALTH_URL" > /dev/null; then
            echo "Health check failed: $HEALTH_URL"
            docker compose -f docker-compose.prod.yml ps || true
            docker compose -f docker-compose.prod.yml logs --tail 200 api worker redis || true
            exit 1
          fi

          echo "Deploy successful. Health check OK: $HEALTH_URL"
          EOF
